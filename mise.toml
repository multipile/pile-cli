# The toolchain scripts/ builds, checks and releases with: activate mise here,
# or run them as `mise x -- …`. zig and cargo-zigbuild link every target,
# including macOS, from one host. Rust is an exact version, never latest:
# mise can resolve latest past the lock. To move mise itself, change
# min_version and run `mise lock` in the same commit.
min_version = "2026.9.17"

[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt", targets = "aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin" }
zig = "0.16.0"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"
jq = "1.8.2"
"aqua:asciinema/asciinema" = "3.2.1"

[env]
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/scripts/zig-cc"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/scripts/zig-cc"
_.path = ["{{config_root}}/bin"]
