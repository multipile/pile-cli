# Every push and pull request runs scripts/check. A push to main that passes
# is tagged, then released: scripts/tag claims the next major.minor.patch by
# pushing v<that>, and scripts/release cross-compiles the tagged commit and
# publishes it. mise's github backend finds the release there. A v* tag
# pushed by hand is checked and released by its own run.
#
# The run on main releases its tag itself, because GitHub starts no run for
# a push made with the GITHUB_TOKEN it hands a run. So the tag it pushes
# would start nothing. Every job works with that token. The jobs that tag and
# release ask for contents: write, which covers pushing a tag and writing a
# release; check only reads.
#
# Once a release is published, the tap job moves the formula in
# multipile/homebrew-tap to it, with scripts/tap.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Every job that builds runs its script in the flake's shell, so it builds
# with the toolchain flake.nix pins and flake.lock locks, the same one as on
# a developer's machine.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/build stamps the commit
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c scripts/check

  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: scripts/tag

  # The tag this run pushed, which starts no run of its own.
  release-main:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c scripts/release "${{ needs.tag.outputs.tag }}"
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A tag pushed by hand, whose own run this is.
  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c scripts/release
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Moves the tap's formula to the release this run published. It follows
  # whichever release job ran, and the other is skipped. The token that
  # GitHub hands a run cannot write to another repository, so the job makes
  # one of the tap's GitHub App, which can write only to the tap. The App's
  # key is a secret of the homebrew-tap environment, which only main and v*
  # tags may use. One tap job runs at a time, so releases reach the tap in
  # order.
  tap:
    needs: [tag, release-main, release]
    if: >-
      !cancelled() &&
      (needs.release-main.result == 'success' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    environment: homebrew-tap
    concurrency:
      group: tap
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: multipile
          repositories: homebrew-tap
      - run: scripts/tap "$TAG"
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
          TAP_TOKEN: ${{ steps.token.outputs.token }}
