[package]
name = "diagrams"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Every declaration is read through the storage interface.
storage = { path = "../storage" }
# What a pile is, and doctor's findings, which a diagram's are added to.
piles = { path = "../piles" }
# The nodes and the edges a repository declares, which a diagram's boxes and
# lines stand for, and which of them differ between two states.
graph = { path = "../graph" }
# A Datalog program asked of the graph: what a diagram says it should show.
query = { path = "../query" }
# multipile's diagrams (github.com/multipile/diagrams), pinned to a commit:
# the reader of a .diagram file and the rules it holds a diagram to; the
# document a diagram is painted into; the page written from it; and the
# picture takumi renders from it.
diagram-format = { git = "https://github.com/multipile/diagrams", rev = "9d9d1b315b133c678a49963d8aaf66a2f760b1cd" }
diagram-document = { git = "https://github.com/multipile/diagrams", rev = "9d9d1b315b133c678a49963d8aaf66a2f760b1cd" }
diagram-html = { git = "https://github.com/multipile/diagrams", rev = "9d9d1b315b133c678a49963d8aaf66a2f760b1cd" }
diagram-render = { git = "https://github.com/multipile/diagrams", rev = "9d9d1b315b133c678a49963d8aaf66a2f760b1cd" }

[dev-dependencies]
# The tests read the manifest of the diagrams' cases.
serde_json = "1.0.151"
